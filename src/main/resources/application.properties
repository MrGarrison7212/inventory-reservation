spring.application.name=inventory-reservation

spring.datasource.url=jdbc:h2:mem:inventory;DB_CLOSE_DELAY=-1
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Waiters on a pessimistic row lock queue for up to 5s instead of failing early.
spring.jpa.properties.jakarta.persistence.lock.timeout=5000
